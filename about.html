<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>about | in bloom</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Ballet&display=swap" rel="stylesheet" />
  <style>
    /* Only styles the new resume feature; existing site styling stays intact. */
    .resume-note { text-align: center; margin: 2.5rem auto 3rem; padding: 1.4rem 1.8rem; max-width: 360px; border: 1px dashed #f8c9e3; background: rgba(255, 225, 240, .12); border-radius: 16px; }
    .resume-note .sparkle { display: block; font-size: 1.4rem; margin-bottom: .5rem; color: #ffd6ed; }
    .resume-note p { margin: 0 0 1rem; font-style: italic; color: #fff0f8; }
    .resume-button { display: inline-block; padding: .75rem 1.6rem; border-radius: 999px; background: #ffd1e9; color: #25276c; border: 1px solid #fff1f9; text-decoration: none; font-weight: 700; letter-spacing: .04em; box-shadow: 3px 4px 0 #b884b2; transition: transform .2s ease, box-shadow .2s ease; }
    .resume-button:hover, .resume-button:focus-visible { transform: translateY(-3px); box-shadow: 3px 7px 0 #b884b2; background: #ffe3f1; }
    .resume-button:focus-visible { outline: 2px solid white; outline-offset: 4px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-left">
      <div class="back-container">
        <a href="index.html" class="back-button" aria-label="Go back to menu">
          <span class="tooltip">← back</span>
        </a>
      </div>
      <div class="title-container">
        <a href="home.html" class="site-title">In bloom</a>
        <p class="site-subtitle">a poetic interface</p>
      </div>
    </div>
    <nav class="header-nav" aria-label="Main navigation">
      <a href="home.html">home</a>
      <a href="blog.html">blog</a>
      <a href="gallery.html">gallery</a>
      <a href="about.html" aria-current="page">about</a>
    </nav>
  </header>

  <main>
    <div class="main-content">
      <h2>In–bloom</h2>
      <p>a poetic interface</p>
    </div>
    <div class="content-frame">
      <div class="image-wrapper">
        <img src="Abeautifulpicture.JPG" class="me-image" alt="A personal photograph" />
        <p class="image-caption">this is all you need to know</p>
      </div>
      <div class="resume-note">
        <span class="sparkle" aria-hidden="true">✧ ⋆ ˚ ✿ ˚ ⋆ ✧</span>
        <p>a little more about what I do...</p>
        <a href="cv.html" class="resume-button">✿ peek at my résumé ↗</a>
      </div>
    </div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
